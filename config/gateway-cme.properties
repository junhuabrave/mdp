# Split mode, step 1: arbitrate A/B lines and relay raw packets over Aeron (no decoding).
mdp.mode=gateway
mdp.protocol=cme-mdp3
mdp.channels=310
mdp.aeron.dir=/tmp/aeron-mdp
mdp.channel.310.incremental.A=udp://127.0.0.1:20001
mdp.channel.310.incremental.B=udp://127.0.0.1:20002
mdp.channel.310.snapshot.A=udp://127.0.0.1:20011
mdp.channel.310.snapshot.B=udp://127.0.0.1:20012
# aeron:ipc on one host; aeron:udp?endpoint=<normalizer-host>:40123 across hosts
mdp.channel.310.relay.channel=aeron:ipc
mdp.channel.310.relay.incremental.streamId=2310
mdp.channel.310.relay.snapshot.streamId=3310
mdp.idle.receiver=backoff
mdp.metrics.inProcessExporter=false
mdp.instance=gw-1
