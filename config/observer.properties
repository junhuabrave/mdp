# Sidecar: reads every counter in the Aeron CnC file (gateway, normalizer, consumers and the
# media driver itself) and exports them through OpenTelemetry. Hot processes run no exporter.
mdp.mode=observer
mdp.aeron.dir=/tmp/aeron-mdp
mdp.metrics.otlp.endpoint=http://localhost:4317
mdp.metrics.intervalMillis=1000
mdp.instance=observer-1
