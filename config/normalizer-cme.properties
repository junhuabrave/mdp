# Split mode, step 2: decode relayed packets, recover, publish the normalized stream.
mdp.mode=normalizer
mdp.protocol=cme-mdp3
mdp.channels=310
mdp.aeron.dir=/tmp/aeron-mdp
mdp.channel.310.incremental.A=aeron:ipc
mdp.channel.310.incremental.A.streamId=2310
mdp.channel.310.snapshot.A=aeron:ipc
mdp.channel.310.snapshot.A.streamId=3310
mdp.output.aeron.channel=aeron:ipc
mdp.output.aeron.streamId=1001
# normalized snapshot loop: full book images on their own stream, for late-joining consumers
mdp.output.snapshot.enabled=true
mdp.output.snapshot.streamId=1002
mdp.output.snapshot.intervalMillis=1000
mdp.idle.receiver=backoff
mdp.metrics.inProcessExporter=false
mdp.instance=norm-1
