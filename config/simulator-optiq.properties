# Synthetic Euronext Optiq feed. Loss on A or B alone is hidden by arbitration; loss on both causes a
# real gap and a snapshot recovery, both visible in Grafana.
sim.protocol=euronext-optiq
sim.channel=7
sim.incremental.A=udp://127.0.0.1:20101
sim.incremental.B=udp://127.0.0.1:20102
sim.snapshot.A=udp://127.0.0.1:20111
sim.snapshot.B=udp://127.0.0.1:20112
sim.rate=20000
sim.instruments=50
sim.loss.a=0.01
sim.loss.b=0.01
sim.loss.both=0.00002
sim.snapshot.intervalMillis=500
sim.durationSeconds=0
