# Split mode, step 3: any number of consumers subscribe to the normalized stream.
mdp.mode=consumer
mdp.aeron.dir=/tmp/aeron-mdp
# untethered: a slow consumer is dropped by Aeron (and recovers) instead of slowing the normalizer
mdp.input.aeron.channel=aeron:ipc?tether=false
mdp.input.aeron.streamId=1001
# normalized snapshot loop: lets this consumer start at any time and repair gaps on its own
mdp.input.snapshot.streamId=1002
mdp.idle.consumer=backoff
mdp.metrics.inProcessExporter=false
mdp.instance=consumer-1
