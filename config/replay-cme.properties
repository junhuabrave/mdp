# All-in-one handler fed from a capture file instead of the network.
# Record one with the simulator:
#   JAVA_OPTS="-Dsim.pcap.out=captures/cme-310.pcap -Dsim.pcap.only=true -Dsim.durationSeconds=30" \
#     mdp-app simulate config/simulator-cme.properties
# or point the URIs at a real capture (tcpdump/pcapng, Ethernet/VLAN/Linux cooked) using CME's
# multicast group:port for each line from config.xml.
#
# URI: pcap:<file>?dst=<ip>:<port>[&src=<ip>][&speed=1|N|max]
# Lines of one file replay in captured order; speed must match across them.
mdp.mode=all-in-one
mdp.protocol=cme-mdp3
mdp.channels=310

mdp.channel.310.incremental.A=pcap:captures/cme-310.pcap?dst=127.0.0.1:20001&speed=1
mdp.channel.310.incremental.B=pcap:captures/cme-310.pcap?dst=127.0.0.1:20002&speed=1
mdp.channel.310.snapshot.A=pcap:captures/cme-310.pcap?dst=127.0.0.1:20011&speed=1
mdp.channel.310.snapshot.B=pcap:captures/cme-310.pcap?dst=127.0.0.1:20012&speed=1
mdp.channel.310.cme.gapPolicy=CHANNEL_STALE

mdp.arbitration.gapTimeoutMicros=500
mdp.arbitration.reorderSlots=1024
mdp.line.timeoutMillis=2000

mdp.pipeline=ringbuffer
mdp.book.depth=10
mdp.idle.receiver=backoff
mdp.idle.consumer=backoff
