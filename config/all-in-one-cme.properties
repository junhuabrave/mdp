# All-in-one: one JVM, UDP A/B lines -> arbitrate -> decode -> ring buffer -> books.
# Pairs with simulator-cme.properties (unicast loopback). For real CME multicast, use
# udp://<group>:<port>?interface=<nic>&source=<ip> URIs from CME's config.xml.
mdp.mode=all-in-one
mdp.protocol=cme-mdp3
mdp.channels=310

mdp.channel.310.incremental.A=udp://127.0.0.1:20001
mdp.channel.310.incremental.B=udp://127.0.0.1:20002
mdp.channel.310.snapshot.A=udp://127.0.0.1:20011
mdp.channel.310.snapshot.B=udp://127.0.0.1:20012
mdp.channel.310.cme.gapPolicy=CHANNEL_STALE

mdp.arbitration.gapTimeoutMicros=500
mdp.arbitration.reorderSlots=1024
mdp.line.timeoutMillis=2000

# ringbuffer (decoder and consumer on separate threads) or inline (one thread)
mdp.pipeline=ringbuffer
mdp.ringbuffer.capacity=8388608
mdp.backpressure=DROP_AND_MARK_STALE
mdp.book.depth=10

# busy-spin for production on isolated cores; backoff is friendlier on a laptop
mdp.idle.receiver=backoff
mdp.idle.consumer=backoff

# OpenTelemetry (OTLP gRPC to the collector in deploy/docker-compose.yml)
mdp.metrics.otlp.endpoint=http://localhost:4317
mdp.metrics.intervalMillis=1000
mdp.instance=aio-1
